<!DOCTYPE html>
<html dir="ltr" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; }
        .container { background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #ffffff; padding: 30px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .content { padding: 30px; }
        .button { display: inline-block; background-color: #667eea; color: #ffffff; padding: 12px 30px; text-decoration: none; border-radius: 4px; margin: 20px 0; font-weight: 600; }
        .details { background-color: #f8f9fa; padding: 16px 20px; border-radius: 4px; margin: 20px 0; }
        .details p { margin: 6px 0; }
        .footer { background-color: #f5f5f5; padding: 20px; text-align: center; font-size: 12px; color: #666; }
        .footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nariño Cultura</h1>
            <p>{% block heading %}{% endblock %}</p>
        </div>
        <div class="content">
            <p>Hola {{ name|default:"" }},</p>
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>Nariño Cultura — Plataforma cultural de la región Nariño, Colombia</p>
            <p><a href="{{ frontend_url }}">Visitar nuestro sitio web</a></p>
        </div>
    </div>
</body>
</html>
