{# Botón compatible con Gmail y Outlook. Uso: {% include "emails/partials/button.html" with url=... label=... %} #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0;">
  <tr>
    <td align="center" bgcolor="#8B4513" style="border-radius:8px;">
      <a href="{{ url }}" target="_blank" style="display:inline-block; padding:14px 30px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:20px; font-weight:700; color:#FFFFFF; text-decoration:none; border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
