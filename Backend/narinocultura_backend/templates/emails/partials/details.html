{# Recuadro de datos (Oro andino). Uso: {% include "emails/partials/details.html" with rows=lista_de_(etiqueta,valor) %} #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td style="background-color:#FBF0D5; border-left:4px solid #C9921A; border-radius:6px; padding:16px 20px;">
      {% for label, value in rows %}{% if value %}
      <p style="margin:{% if forloop.first %}0{% else %}8px 0 0{% endif %}; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:22px; color:#5C4F3A;">
        {{ label }}: <strong style="color:#1A1208;">{{ value }}</strong>
      </p>
      {% endif %}{% endfor %}
    </td>
  </tr>
</table>
