<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nariño Cultura: obras, artesanías, subastas, músicos y la agenda cultural del departamento de Nariño."
    />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <title>Nariño Cultura</title>
    <script>
      // Aplica el modo claro/oscuro antes de dibujar para que no haya destello al abrir en oscuro
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('nc-theme-store') || 'null')
          var theme = saved && saved.state && saved.state.theme
          if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <script>
      // La portada se ve con una imagen grande: se pide ya, sin esperar a que cargue el JavaScript (mejora el LCP)
      ;(function () {
        if (location.pathname !== '/') return
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/carnaval-hero.webp'
        l.type = 'image/webp'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
