name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Backend/narinocultura_backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.4.9
      # El backend completo está en cero advertencias (HU-B12): cualquier advertencia nueva falla el CI.
      - name: ruff check
        run: ruff check --config ../pyproject.toml .

  test:
    name: Tests + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt
      - run: pip install -r ../requirements-dev.txt
      - name: Ejecutar pruebas
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m coverage run --rcfile=../pyproject.toml --source=. manage.py test apps
      - name: Cobertura (meta RNF13 >= 80 %)
        run: python -m coverage report --rcfile=../pyproject.toml --fail-under=80
