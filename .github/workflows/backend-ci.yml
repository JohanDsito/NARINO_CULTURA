name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Backend/narinocultura_backend

jobs:
  lint:
    name: Lint (ruff en archivos modificados)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.4.9
      # Definición de terminado: ruff sin advertencias en los archivos tocados.
      # Las advertencias heredadas del resto del código se eliminan en HU-B12.
      - name: ruff check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- . | grep '\.py$' | sed 's#^Backend/narinocultura_backend/##' || true)
          if [ -z "$files" ]; then
            echo "No hay archivos Python modificados."
            exit 0
          fi
          echo "$files"
          ruff check --config ../pyproject.toml $files

  test:
    name: Tests + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/narinocultura_backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ejecutar pruebas
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m coverage run --rcfile=../pyproject.toml --source=. manage.py test apps
      - name: Cobertura (meta RNF13 >= 80 %)
        run: python -m coverage report --rcfile=../pyproject.toml --fail-under=80
