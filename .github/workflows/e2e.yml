name: E2E y Lighthouse

# Pruebas end-to-end (Playwright) de la web real contra el back real con config.settings.e2e.
# Todo corre local en el runner: Postgres de servicio, daphne y vite preview. No usa ningún secret:
# las llaves de Wompi y demás son falsas y el back nunca llama a servicios externos.
# Git Flow: corre en los PR hacia develop y main, y se puede lanzar a mano.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "Backend/**"
      - "Front/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright + Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: narino
          POSTGRES_PASSWORD: narino_e2e
          POSTGRES_DB: narino_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narino -d narino_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.e2e
      DATABASE_URL: postgres://narino:narino_e2e@127.0.0.1:5432/narino_e2e
      API_URL: http://127.0.0.1:8000
      WEB_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4

      # ── Backend ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt
      - name: Instalar dependencias del backend
        run: pip install -r Backend/requirements-dev.txt
      - name: Migrar y sembrar datos de demostración
        working-directory: Backend/narinocultura_backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --confirmar
      - name: Levantar el backend (daphne)
        working-directory: Backend/narinocultura_backend
        run: |
          nohup python -m daphne -b 127.0.0.1 -p 8000 config.asgi:application > "$RUNNER_TEMP/daphne.log" 2>&1 &
          curl --silent --fail --retry 30 --retry-delay 2 --retry-connrefused "$API_URL/health/"

      # ── Front ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front/Narino_Front/package-lock.json
      - name: Instalar dependencias del front
        working-directory: Front/Narino_Front
        run: npm ci
      - name: Build apuntando al backend local
        working-directory: Front/Narino_Front
        # Sin VITE_API_BASE_URL el front usaría la API de producción
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Servir el build (vite preview)
        working-directory: Front/Narino_Front
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          curl --silent --fail --retry 30 --retry-delay 2 --retry-connrefused --output /dev/null "$WEB_URL/"

      # ── Playwright ─────────────────────────────────────────────────────────
      - name: Versión de Playwright
        id: playwright
        working-directory: Front/Narino_Front
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Caché de Chromium
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar Chromium de Playwright
        working-directory: Front/Narino_Front
        run: |
          if [ "${{ steps.cache-chromium.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Tipos de las pruebas e2e
        working-directory: Front/Narino_Front
        run: npm run e2e:typecheck
      - name: Pruebas e2e
        working-directory: Front/Narino_Front
        timeout-minutes: 10
        env:
          CI: "true"
          E2E_API_URL: ${{ env.API_URL }}
          E2E_BASE_URL: ${{ env.WEB_URL }}
        run: npm run e2e

      # ── Lighthouse (solo avisos: no bloquea el PR) ─────────────────────────
      - name: Lighthouse (inicio, catálogo y detalle)
        if: ${{ !cancelled() }}
        # Solo avisos: ni un puntaje bajo ni una falla de la herramienta ponen rojo el job
        continue-on-error: true
        timeout-minutes: 5
        working-directory: Front/Narino_Front
        run: |
          OBRA_ID=$(curl --silent --fail "$API_URL/api/v1/artworks/?page_size=1" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d['results'] if isinstance(d,dict) else d; print(r[0]['id'])")
          npx --yes @lhci/cli@0.14.0 autorun \
            --config=lighthouserc.json \
            --collect.url="$WEB_URL/" \
            --collect.url="$WEB_URL/artworks" \
            --collect.url="$WEB_URL/artworks/$OBRA_ID" \
            --upload.target=filesystem \
            --upload.outputDir=lhci-results

      # ── Artefactos ─────────────────────────────────────────────────────────
      - name: Subir reporte HTML de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Front/Narino_Front/playwright-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Subir traces y capturas de las pruebas fallidas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: Front/Narino_Front/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Subir resultados de Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: Front/Narino_Front/lhci-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Subir registros del backend y del preview
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-servidores
          path: |
            ${{ runner.temp }}/daphne.log
            ${{ runner.temp }}/preview.log
          retention-days: 7
          if-no-files-found: ignore
