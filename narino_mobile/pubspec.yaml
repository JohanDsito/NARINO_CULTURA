name: narino_cultura
description: Plataforma digital para el ecosistema artístico de Nariño
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  go_router: ^13.0.0

  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  dio: ^5.4.0

  flutter_secure_storage: ^9.0.0

  google_fonts: ^6.2.1

  flutter_svg: ^2.0.9

  cached_network_image: ^3.3.1

  intl: ^0.19.0
  equatable: ^2.0.5

  image_picker: ^1.1.2
  photo_view: ^0.15.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  video_player: ^2.8.6
  web_socket_channel: ^2.4.0
  flutter_map: ^6.1.0          # Mapa interactivo con OpenStreetMap (gratuito, sin API key)
  latlong2: ^0.9.0             # Coordenadas para flutter_map
  table_calendar: ^3.1.0       # Widget de calendario mensual para Flutter
  connectivity_plus: ^7.3.2    # Detecta cuándo vuelve la red para recargar (MO-DISP-02)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Íconos de la app (flutter pub run flutter_launcher_icons). Fuentes en assets/branding/, generadas con la marca:
# montaña blanca sobre el degradado naranja → magenta.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icono.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/branding/icono_fondo.png"
  adaptive_icon_foreground: "assets/branding/icono_frente.png"
  adaptive_icon_monochrome: "assets/branding/icono_monocromo.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# Pantalla de inicio nativa (dart run flutter_native_splash:create): fondo Carnaval claro u oscuro según el teléfono.
flutter_native_splash:
  color: "#F5F5F7"
  color_dark: "#050505"
  image: assets/branding/splash.png
  image_dark: assets/branding/splash.png
  android_12:
    image: assets/branding/splash_android12.png
    image_dark: assets/branding/splash_android12.png
    icon_background_color: "#E50050"
    icon_background_color_dark: "#E50050"
    color: "#F5F5F7"
    color_dark: "#050505"
  web: false
